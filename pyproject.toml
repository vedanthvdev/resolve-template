[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolve-template"
version = "0.1.0"
description = "AI-friendly DaVinci Resolve placeholder story templates that export genuine .drp via Resolve APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "resolve-template contributors" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
resolve-template = "resolve_template.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resolve_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "resolve: requires DaVinci Resolve scripting (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
